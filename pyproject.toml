[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "convolute"
version = "0.1.0"
description = "Paraphrase text through configurable chains of LLM translations"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = ["httpx>=0.27,<1"]

[project.urls]
Homepage = "https://github.com/git-akihakune/convolute"
Repository = "https://github.com/git-akihakune/convolute"
Issues = "https://github.com/git-akihakune/convolute/issues"

[project.optional-dependencies]
test = ["pytest>=8", "build>=1"]

[project.scripts]
convolute = "convolute.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
